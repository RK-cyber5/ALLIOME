  <circle cx="32" cy="20" r="5" stroke="rgba(248,250,252,0.4)" stroke-width="1"/>
  <!-- Base nodes (cyan + mint — the alliance) -->
  <circle cx="18" cy="48" r="3.6" fill="#22D3EE"/>
  <circle cx="18" cy="48" r="3.6" stroke="rgba(11,16,32,0.5)" stroke-width="1"/>
  <circle cx="46" cy="48" r="3.6" fill="#34D399"/>
